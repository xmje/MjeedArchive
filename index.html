<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mjeed's Archive</title>
<link rel="icon" type="image/png" href="assets/site-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.cdnfonts.com/css/arsenica-trial" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,400;1,500&family=Kaushan+Script&family=Archivo+Black&family=Bodoni+Moda:ital,wght@0,700;0,800;0,900&family=Aref+Ruqaa+Ink:wght@400;700&family=Cairo:wght@400;600;800&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a0908;
    --ink-2:#141210;
    --paper:#ede7da;
    --paper-dim:#a8a196;
    --rust:rgb(237, 231, 218);
    --steel:#6f9aa8;
    --line: rgba(237,231,218,0.14);
    --line-strong: rgba(237,231,218,0.28);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',sans-serif;
    overflow-x:hidden;
  }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    min-height:100svh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding:6vh 5vw;
    background:var(--ink);
    border-bottom:1px solid var(--line);
  }
  .arc-svg{
    width:92%;
    max-width:660px;
    height:auto;
    display:block;
    margin:0 auto;
    z-index:2;
  }
  .arc-text{
    font-family:'Arsenica Trial','Arsenica Display','Bodoni Moda',serif;
    font-weight:600;
    font-size:158px;
    letter-spacing:1px;
    fill:var(--paper);
  }
  .row2-caption{
    font-family:'Space Mono',monospace;
    font-size:clamp(11px, 1.6vw, 13px);
    letter-spacing:0.28em;
    color:var(--paper-dim);
    margin-top:-22px;
    z-index:2;
  }
  .row3{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    justify-items:center;
    gap:clamp(18px, 5vw, 52px);
    width:100%;
    max-width:720px;
    margin:10px auto 0;
  }
  .row3-left{ justify-self:end; }
  .row3-right{ justify-self:start; }
  .row3-side{
    flex:0 0 auto;
    font-family:'Space Mono',monospace;
    font-size:clamp(11px, 1.8vw, 14px);
    letter-spacing:0.22em;
    color:var(--paper-dim);
  }
  .row3-logo{
    width:clamp(38px, 6vw, 58px);
    height:auto;
    display:block;
  }
  .row3-center{
    font-family:'Aref Ruqaa Ink','Cairo',serif;
    font-weight:700;
    direction:rtl;
    font-size:clamp(58px, 12vw, 128px);
    line-height:1;
    color:var(--paper);
    white-space:nowrap;
    transform:scaleX(1.18);
  }
  .tagline{
    margin-top:34px;
    max-width:520px;
    font-family:'Space Mono',monospace;
    font-size:clamp(11px, 1.8vw, 13px);
    letter-spacing:0.14em;
    line-height:1.8;
    color:var(--paper-dim);
    z-index:2;
  }
  .hero-doodle{
    position:absolute;
    z-index:1;
    pointer-events:none;
  }
  .hero-doodle svg{width:100%; height:100%; display:block; overflow:visible;}
  .hero-doodle path{
    fill:none;
    stroke:var(--paper-dim);
    stroke-width:1.4;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:var(--len);
    animation:handDraw var(--dur,4.2s) ease-in-out infinite;
    animation-delay:var(--delay,0s);
  }
  @keyframes handDraw{
    0%{ stroke-dashoffset:var(--len); opacity:0.1; }
    45%{ stroke-dashoffset:0; opacity:0.5; }
    62%{ stroke-dashoffset:0; opacity:0.5; }
    100%{ stroke-dashoffset:calc(var(--len) * -1); opacity:0.1; }
  }
  .scroll-cue{
    position:absolute; bottom:36px; left:50%; transform:translateX(-50%);
    font-family:'Space Mono',monospace; font-size:10px; letter-spacing:0.25em;
    color:var(--paper-dim);
    display:flex; flex-direction:column; align-items:center; gap:10px;
    z-index:2;
  }
  .scroll-cue .bar{width:1px; height:34px; background:linear-gradient(var(--paper-dim), transparent); animation:pulse 2.2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.3} 50%{opacity:1}}

  /* ---------- Nav / filters ---------- */
  .filters{
    position:sticky; top:0; z-index:100;
    background:rgba(10,9,8,0.86);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    display:flex; justify-content:center; align-items:center;
    padding:18px 5vw;
    flex-wrap:wrap;
    gap:8px;
  }
  .filter-btn{
    font-family:'Inter',sans-serif;
    font-size:12px;
    letter-spacing:0.06em;
    color:var(--paper-dim);
    background:transparent;
    border:1px solid var(--line-strong);
    border-radius:100px;
    padding:9px 18px;
    cursor:pointer;
    display:flex; align-items:baseline; gap:8px;
    transition:all .25s ease;
  }
  .filter-btn .ar{font-family:'Cairo',sans-serif; font-size:11px; direction:rtl;}
  .filter-btn:hover{color:var(--paper); border-color:var(--paper-dim);}
  .filter-btn:focus-visible{outline:2px solid var(--rust); outline-offset:2px;}
  .filter-btn.active{
    background:var(--rust); border-color:var(--rust); color:var(--ink);
  }

  /* ---------- Gallery ---------- */
  .gallery-wrap{padding:64px 5vw 100px;}
  .gallery{
    columns:4 260px;
    column-gap:22px;
  }
  @media (max-width:900px){ .gallery{columns:2 200px;} }
  @media (max-width:520px){ .gallery{columns:1;} }

  .card{
    break-inside:avoid;
    margin-bottom:22px;
    position:relative;
    border-radius:2px;
    overflow:hidden;
    cursor:pointer;
    background:var(--ink-2);
    border:1px solid var(--line);
    opacity:0;
    transform:translateY(36px);
    transition:opacity .8s cubic-bezier(.2,.7,.2,1), transform .8s cubic-bezier(.2,.7,.2,1);
  }
  .card.visible{opacity:1; transform:translateY(0);}
  .card.hidden-cat{display:none;}
  .card img{
    display:block; width:100%; height:auto;
    transition:transform .7s cubic-bezier(.2,.7,.2,1), filter .5s ease;
  }
  .card:hover img{transform:scale(1.045); filter:brightness(0.68);}
  .card-info{
    position:absolute; left:0; right:0; bottom:0;
    padding:16px 16px 14px;
    background:linear-gradient(to top, rgba(0,0,0,0.85), transparent);
    transform:translateY(12px);
    opacity:0;
    transition:opacity .4s ease, transform .4s ease;
  }
  .card:hover .card-info{opacity:1; transform:translateY(0);}
  .card-title{font-family:'Fraunces',serif; font-weight:600; font-size:19px; color:var(--paper); line-height:1.1;}
  .card-sub{font-family:'Space Mono',monospace; font-size:10.5px; letter-spacing:0.04em; color:var(--paper-dim); margin-top:5px;}
  .card-tag{
    position:absolute; top:12px; right:12px;
    font-family:'Cairo',sans-serif; font-size:11px; direction:rtl;
    color:var(--paper); background:rgba(10,9,8,0.72);
    border:1px solid var(--line-strong);
    padding:4px 10px; border-radius:100px;
    opacity:0; transition:opacity .3s ease;
  }
  .card:hover .card-tag{opacity:1;}

  /* ---------- Lightbox ---------- */
  .lightbox{
    position:fixed; inset:0; z-index:1000;
    background:rgba(20,21,24,0.94);
    display:flex; align-items:center; justify-content:center;
    padding:5vh 5vw;
    opacity:0; pointer-events:none;
    transition:opacity .35s ease;
  }
  .lightbox.open{opacity:1; pointer-events:auto;}
  .lightbox-inner{max-width:900px; max-height:90vh; display:flex; flex-direction:column; align-items:center; gap:16px;}
  .lightbox img{
    max-width:100%; max-height:74vh; width:auto; object-fit:contain;
    border:1px solid var(--line-strong);
    transform:scale(0.96); transition:transform .35s ease;
  }
  .lightbox.open img{transform:scale(1);}
  .lightbox-caption{text-align:center;}
  .lightbox-caption .t{font-family:'Fraunces',serif; font-weight:600; font-size:26px;}
  .lightbox-caption .s{font-family:'Space Mono',monospace; font-size:11px; color:var(--paper-dim); margin-top:6px; letter-spacing:0.05em;}
  .lb-close{
    position:absolute; top:24px; right:5vw;
    font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.15em;
    color:var(--paper); background:transparent; border:1px solid var(--line-strong);
    padding:10px 16px; border-radius:100px; cursor:pointer;
  }
  .lb-close:hover{border-color:var(--rust); color:var(--rust);}
  .lb-close:focus-visible{outline:2px solid var(--rust); outline-offset:2px;}

  /* ---------- Footer ---------- */
  footer{
    border-top:1px solid var(--line);
    padding:40px 5vw;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px;
    font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.05em; color:var(--paper-dim);
  }
  footer .rt{direction:rtl; font-family:'Cairo',sans-serif; color:var(--paper-dim);}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
    html{scroll-behavior:auto;}
    .card{opacity:1; transform:none;}
  }
</style>
</head>

const gallery = document.getElementById('gallery');

DATA.forEach((item, i) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.cat = item.cat;
  card.innerHTML = `
    <span class="card-tag">${item.cat_ar}</span>
    <img src="${item.data}" alt="${item.title}" loading="lazy">
    <div class="card-info">
      <div class="card-title">${item.title}</div>
      <div class="card-sub">${item.subtitle}</div>
    </div>
  `;
  card.addEventListener('click', () => openLightbox(item));
  gallery.appendChild(card);
});

// scroll reveal
const io = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if(e.isIntersecting){
      e.target.classList.add('visible');
      io.unobserve(e.target);
    }
  });
}, {threshold:0.12, rootMargin:'0px 0px -40px 0px'});
document.querySelectorAll('.card').forEach(c => io.observe(c));

// filters
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const cat = btn.dataset.cat;
    document.querySelectorAll('.card').forEach(card => {
      const match = cat === 'all' || card.dataset.cat === cat;
      card.classList.toggle('hidden-cat', !match);
      if(match){
        card.classList.remove('visible');
        requestAnimationFrame(()=> requestAnimationFrame(()=> {
          card.classList.add('visible');
        }));
      }
    });
  });
});

// lightbox
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbTitle = document.getElementById('lbTitle');
const lbSub = document.getElementById('lbSub');

function openLightbox(item){
  lbImg.src = item.data;
  lbImg.alt = item.title;
  lbTitle.textContent = item.title;
  lbSub.textContent = item.subtitle;
  lightbox.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox(){
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
}
document.getElementById('lbClose').addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => { if(e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeLightbox(); });
</script>
